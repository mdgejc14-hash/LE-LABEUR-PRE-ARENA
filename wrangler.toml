# =============================================================================
# LE LABEUR — configuration Cloudflare Worker (P0-C)
# =============================================================================
# État réel de cette configuration dans la session P0-C :
#   * code Worker : RÉEL (src/backend/worker/cloudflareEntry.ts) ;
#   * binding Hyperdrive de développement : PRÉPARÉ — l'ID ci-dessous est un
#     PLACEHOLDER explicite ; aucun Hyperdrive n'existe côté Cloudflare ;
#   * environnement `production` : PRÉPARÉ — le binding y est volontairement
#     absent (voir plus bas) ; le Worker y démarre donc FERMÉ, jamais avec une
#     base implicite.
#
# Secrets : JAMAIS dans ce fichier. Utiliser `wrangler secret put <NOM> --env <env>`
# ou `.dev.vars` (gitignoré) en développement local.
# Les `vars` ci-dessous sont non secrets (modes, limites, audience OAuth publique).
# =============================================================================

name = "lelabeur-api"
main = "src/backend/worker/cloudflareEntry.ts"

# `nodejs_compat` est REQUIS par node-postgres (`node:net`, `node:tls`, `node:crypto`).
# La date de compatibilité est volontairement explicite et figée : elle doit être
# >= 2024-09-23 pour que `pg` fonctionne derrière Hyperdrive.
compatibility_date = "2026-10-05"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# -----------------------------------------------------------------------------
# Profil par défaut = DÉVELOPPEMENT (wrangler dev / wrangler deploy sans --env)
# -----------------------------------------------------------------------------
[vars]
PERSISTENCE = "postgres"
DB_POOL_MAX = "5"
DB_STATEMENT_TIMEOUT_MS = "15000"
DB_APPLICATION_NAME = "lelabeur-worker"
SESSION_TTL_SECONDS = "43200"
COOKIE_SECURE = "true"
WORKER_ENV = "development"
# P0-PAY-1 — avance (ms) du rappel pré-échéance. VOLONTAIREMENT NON FIXÉE :
# aucun job pré-échéance n'est armé tant que l'exploitant ne décide pas la valeur,
# car le modèle ne contient aucune règle par défaut (`leadTimeMs: null`).
# PAYMENT_PRE_DUE_LEAD_TIME_MS = ""  # entier strictement positif, <= 2592000000
# P0-DISPUTE-1 — aucun délai de preuve par défaut; durée à valider par l'exploitant.
# CLAIM_EVIDENCE_DEADLINE_MS = ""  # entier strictement positif en millisecondes
# Audience OAuth Google PUBLIQUE (aucun secret). Vide = frontière fermée (401/501).
GOOGLE_CLIENT_ID = ""

# Binding Hyperdrive de développement.
# `id` : PLACEHOLDER — à remplacer par l'ID retourné par
#   npx wrangler hyperdrive create lelabeur-dev --connection-string="postgresql://…"
# En local, `wrangler dev` n'utilise PAS cet ID : la connexion vient de
#   CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE (.dev.vars).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000-0000-0000-0000-000000000000"

# -----------------------------------------------------------------------------
# PRODUCTION (wrangler deploy --env production)
# -----------------------------------------------------------------------------
# `vars` et les bindings ne sont PAS hérités : chaque environnement doit les
# redéclarer (sinon le déploiement part avec des vars vides et zéro binding).
[env.production]
name = "lelabeur-api"

[env.production.vars]
PERSISTENCE = "postgres"
DB_POOL_MAX = "5"
DB_STATEMENT_TIMEOUT_MS = "15000"
DB_APPLICATION_NAME = "lelabeur-worker"
SESSION_TTL_SECONDS = "43200"
COOKIE_SECURE = "true"
WORKER_ENV = "production"
# P0-PAY-1 — même règle qu'en développement : aucune valeur par défaut installée.
# PAYMENT_PRE_DUE_LEAD_TIME_MS = ""  # absent => aucun job armé ; entier > 0, <= 2592000000
# P0-DISPUTE-1 — aucune durée de preuve implicite; valeur validée par l'exploitant.
# CLAIM_EVIDENCE_DEADLINE_MS = ""  # entier positif en millisecondes
GOOGLE_CLIENT_ID = ""

# Binding Hyperdrive de production : VOLONTAIREMENT ABSENT.
# Aucun Hyperdrive réel n'existe dans cette session, et le placeholder de
# développement n'est pas hérité. Conséquence voulue : déployé tel quel, le
# Worker de production répond 503 sur /healthz (`misconfigured`) et refuse
# toute route protégée — jamais de base implicite.
#
# Pour l'activer :
#   1. npx wrangler hyperdrive create lelabeur-prod --connection-string="postgresql://…" --caching-disabled=true
#      (cache désactivé : les lectures d'identité/session exigent un état frais)
#   2. npx wrangler secret put POSTGRES_CONNECTION_STRING --env production   # (repli optionnel)
#   3. décommenter le bloc ci-dessous avec l'ID réel, puis redéployer :
#
# [[env.production.hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<ID_HYPERDRIVE_PRODUCTION>"

# -----------------------------------------------------------------------------
# P0-CRON-QUEUE — frontière du déclencheur périodique, PRÉPARÉE, non installée.
# -----------------------------------------------------------------------------
# Le Worker EXPOSE le handler `scheduled()` (P0-PAY-1) et il exécute désormais
# la PASSÉE bornée du worker d'automatisation EXISTANT :
#   scheduled() → recoverStaleClaims (crash après réservation, avant ack)
#               → drain (événements → paiements échus → jobs échus)
#               → audit `CRON_TICK_EXECUTED`
# AUCUN bloc `[triggers]` n'est ACTIF : aucune planification de production
# n'est installée dans cette tranche, conformément à l'étape CLOUDFLARE
# PRODUCTION. Déployer sans cron ne déclenche donc rien ; l'activation — et
# le choix de la cadence (décision d'exploitation, jamais une valeur par
# défaut dans le code) — appartient à cette étape. Pour l'activer :
#
# [env.production.triggers]
# crons = ["* * * * *"]   # cadence à décider par l'exploitant
#
# Garde-fous (code, pas configuration) : le trigger ne produit aucune action
# métier arbitraire (il ne fait que déclencher le worker d'automatisation),
# chaque tick est audité, et la borne d'orphanisation des claims
# (10 min > timeout d'énoncé 15 s) protège des traitements réellement en cours.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Hors périmètre P0-C (volontairement absents) :
# R2, Queues, Durable Objects, KV : aucun binding, aucune migration DO.
# (Cron Triggers : voir le bloc P0-CRON-QUEUE ci-dessus — frontière préparée,
# aucun bloc actif.)
# -----------------------------------------------------------------------------
